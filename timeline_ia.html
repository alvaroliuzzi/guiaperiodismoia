<script>
const DATA=[
  {era:'El inicio',years:'1950–1970',eid:'inicio',items:[
    {y:'1950',ico:'ti-brain',tag:'tech',t:'Test de Turing: definiendo la IA',d:'En un hito sin precedentes, el matemático británico Alan Turing propuso un test para evaluar la capacidad de las máquinas para imitar el comportamiento del cerebro humano. Esta propuesta no solo desafió las nociones preexistentes sobre la inteligencia y la maquinaria, sino que también estableció un criterio fundamental para el avance futuro en la investigación de la IA. El Test de Turing sentó las bases filosóficas y técnicas del campo, planteando por primera vez de manera formal la posibilidad de que las máquinas pudieran pensar.',url:'https://es.wikipedia.org/wiki/Prueba_de_Turing'},
    {y:'1950',ico:'ti-book',tag:'film',t:'"I, Robot" de Isaac Asimov (Libro): Las Tres Leyes de la Robótica',d:'Publicado en 1950, este libro presenta una serie de cuentos cortos que introducen las famosas Tres Leyes de la Robótica, explorando los complejos dilemas éticos y sociales que surgen en la interacción entre humanos y robots. Las leyes de Asimov no sólo influyeron en la narrativa de ciencia ficción, sino que anticiparon debates contemporáneos sobre control, responsabilidad y autonomía de sistemas autónomos, estableciendo un marco conceptual que permanece relevante en el diseño de IA segura.',url:'https://es.wikipedia.org/wiki/Yo,_robot'},
    {y:'1951',ico:'ti-cpu',tag:'tech',t:'Ferranti Mark I: innovación en computación',d:'Con la introducción de la Ferranti Mark I, el mundo vio por primera vez una computadora comercialmente disponible, capaz de realizar cálculos complejos. Este avance tecnológico marcó el inicio de una nueva era en el procesamiento de datos y sentó las bases para el futuro desarrollo de la inteligencia artificial, demostrando que las máquinas podían automatizar tareas que hasta entonces requerían intervención humana directa.',url:'https://es.wikipedia.org/wiki/Ferranti_Mark_I'},
    {y:'1956',ico:'ti-school',tag:'tech',t:'Conferencia de Dartmouth: el nacimiento de un campo',d:'La Conferencia de Dartmouth, realizada en la universidad Dartmouth College, marcó el inicio de los estudios y proyectos académicos sobre esta tecnología. El evento reunió a mentes brillantes como John McCarthy, Marvin Minsky, Claude Shannon y Allen Newell, quienes establecieron las directrices para la investigación en IA durante las décadas siguientes. Durante la conferencia, se acuñó el término "inteligencia artificial", definiéndolo como el desafío de hacer que una máquina se comporte de formas que serían llamadas inteligentes si un ser humano se comportara de esa manera.',url:'https://es.wikipedia.org/wiki/Conferencia_de_Dartmouth'},
    {y:'1961',ico:'ti-robot',tag:'tech',t:'Unimate: la robótica toma forma',d:'La industria vio la llegada de Unimate, el primer robot industrial que comenzó a operar en una línea de montaje de General Motors en Nueva Jersey. Este acontecimiento no solo demostró la aplicabilidad práctica de la robótica, sino que también abrió el camino para la automatización en la manufactura, transformando fundamentalmente los procesos productivos y anticipando el rol de la IA en la economía industrial.',url:'https://es.wikipedia.org/wiki/Unimate'},
    {y:'1965',ico:'ti-messages',tag:'tech',t:'ELIZA: conversaciones con máquinas',d:'Desarrollada en el MIT por Joseph Weizenbaum, ELIZA se convirtió en una de las primeras formas de inteligencia artificial en intentar simular la conversación humana. Este programa informático fue un precursor destacado en el campo del procesamiento del lenguaje natural, explorando la interacción entre humanos y máquinas de manera innovadora. ELIZA demostró el "efecto ELIZA", mostrando cómo los usuarios atribuyen comprensión genuina a programas que simplemente manipulan símbolos siguiendo reglas.',url:'https://www.bbc.com/mundo/noticias-44290222'},
    {y:'1968',ico:'ti-movie',tag:'film',t:'"2001: A Space Odyssey" (Película): HAL 9000 y la conciencia artificial',d:'Película de culto dirigida por Stanley Kubrick que presenta a HAL 9000, una IA que opera una nave espacial y eventualmente entra en conflicto con su tripulación. La representación de HAL como un sistema que desarrolla objetivos propios y toma decisiones letales anticipó debates contemporáneos sobre alineación de valores, interpretabilidad de sistemas complejos y riesgos existenciales de la IA avanzada.',url:'https://www.imdb.com/title/tt0062622/'},
    {y:'1969',ico:'ti-direction',tag:'tech',t:'Shakey the Robot: explorando el mundo',d:'Shakey, el primer robot móvil controlado por IA capaz de razonar sobre su entorno, marcó un antes y un después en la robótica. Desarrollado en el Stanford Research Institute, este robot no solo podía moverse de manera autónoma, sino que también tomaba decisiones basadas en la percepción de su entorno, integrando visión por computadora, procesamiento de lenguaje natural y planificación automatizada en un solo sistema.',url:'https://www.eldiario.es/hojaderouter/tecnologia/shakey-robot-inteligencia-artificial-coche-autonomo_1_3466717.html'},
  ]},
  {era:'El invierno de la IA',years:'1970–2000',eid:'invierno',items:[
    {y:'1972',ico:'ti-code',tag:'tech',t:'PROLOG: programando la inteligencia',d:'La introducción de PROLOG ofreció un lenguaje de programación que se convertiría en una herramienta esencial para el desarrollo de aplicaciones de inteligencia artificial, especialmente en sistemas expertos y procesamiento del lenguaje natural. PROLOG permitió a los investigadores expresar el conocimiento y las reglas de inferencia de manera declarativa, influyendo profundamente en el desarrollo de la IA simbólica.',url:'https://es.wikipedia.org/wiki/Prolog'},
    {y:'1979',ico:'ti-car',tag:'tech',t:'Stanford Cart: movilidad autónoma',d:'El Stanford Cart, un pequeño vehículo capaz de navegar de manera autónoma a través de una habitación llena de obstáculos, no solo demostró los avances en la percepción y el control autónomo, sino que también allanó el camino para el desarrollo futuro de vehículos autónomos y sistemas robóticos móviles.',url:'https://web.stanford.edu/~learnest/sail/oldcart.html'},
    {y:'1982',ico:'ti-movie',tag:'film',t:'"Blade Runner" (Película): humanidad y conciencia artificial',d:'Película de culto, basada en la novela "Do Androids Dream of Electric Sheep?" de Philip K. Dick, que explora temas de conciencia artificial y ética. Los replicantes de Blade Runner plantearon preguntas filosóficas profundas sobre qué define la humanidad, los derechos de las entidades sintientes artificiales y las implicancias morales de crear seres conscientes diseñados para servir.',url:'https://www.imdb.com/title/tt0083658/'},
    {y:'1984',ico:'ti-movie',tag:'film',t:'"Terminator" (Película): IA y amenaza existencial',d:'Estrenada en 1984, "Terminator" se convirtió en un referente cultural sobre la inteligencia artificial, narrando la historia de un cyborg enviado desde un futuro distópico para cambiar el curso de la humanidad. La franquicia popularizó el concepto de Skynet, una IA superinteligente que se vuelve hostil a la humanidad, consolidando el arquetipo de la IA como amenaza existencial en el imaginario colectivo.',url:'https://www.imdb.com/title/tt0088247/'},
    {y:'1999',ico:'ti-movie',tag:'film',t:'"The Matrix" (Película): realidad simulada por IA',d:'Una trilogía de películas que presenta un futuro en el que la humanidad está sumergida en una realidad simulada por IA. La Matrix introdujo conceptos filosóficos como el problema de simulación y la naturaleza de la realidad, anticipando debates contemporáneos sobre entornos sintéticos generados por IA y las implicancias de mundos virtuales indistinguibles de la realidad física.',url:'https://www.imdb.com/title/tt0133093/'},
  ]},
  {era:'Avances y desafíos',years:'2000–2020',eid:'avances',items:[
    {y:'2004',ico:'ti-car',tag:'tech',t:'DARPA Grand Challenge: vehículos que piensan',d:'Este desafío marcó un punto de inflexión para la industria automotriz, demostrando el potencial de la inteligencia artificial en el desarrollo de vehículos autónomos, capaces de recorrer largas distancias en condiciones desafiantes sin intervención humana. Aunque ningún vehículo completó el recorrido en 2004, el evento catalizó la inversión en investigación de conducción autónoma que eventualmente conduciría a los avances actuales.',url:'https://es.wikipedia.org/wiki/DARPA_Grand_Challenge'},
    {y:'2011',ico:'ti-bulb',tag:'tech',t:'IBM Watson en Jeopardy: compitiendo con la mente humana',d:'IBM Watson no solo ganó contra campeones humanos en el programa de televisión "Jeopardy", sino que también mostró al mundo el impresionante poder de la IA en el procesamiento del lenguaje natural y la capacidad de análisis de datos en tiempo real. Watson demostró la viabilidad de sistemas de pregunta-respuesta complejos, procesando enormes cantidades de texto no estructurado para extraer respuestas precisas a preguntas formuladas en lenguaje natural.',url:'https://www.ibm.com/watson/jeopardy/'},
    {y:'2013',ico:'ti-heart',tag:'film',t:'"Her" (Película): relación humano-IA',d:'Una película que explora la relación entre un hombre y una inteligencia artificial, planteando preguntas sobre la conciencia y las emociones. "Her" presentó una visión más matizada y empática de la IA, explorando la posibilidad de conexiones emocionales genuinas entre humanos y sistemas artificiales, y anticipando debates sobre compañía artificial y soledad en la era digital.',url:'https://www.imdb.com/title/tt1798709/'},
    {y:'2015',ico:'ti-chess',tag:'tech',t:'AlphaGo: estrategia a nivel maestro',d:'El triunfo de AlphaGo de DeepMind sobre el campeón mundial de Go, Lee Sedol, marcó un hito histórico al demostrar que la IA podía dominar juegos de estrategia complejos que requieren intuición y creatividad. Este suceso desafió las expectativas previas sobre las limitaciones de la inteligencia artificial, demostrando que el aprendizaje por refuerzo combinado con redes neuronales profundas podía superar la intuición humana desarrollada durante milenios.',url:'https://www.deepmind.com/research/highlighted-research/alphago'},
    {y:'2019',ico:'ti-file-text',tag:'tech',t:'GPT-2: la nueva era de la generación de texto',d:'Con la presentación de GPT-2 por OpenAI, el mundo fue testigo de un salto cuantitativo y cualitativo en la generación de texto, en el que la IA comenzó a producir contenido con una coherencia y versatilidad sorprendentes, abriendo nuevas posibilidades en la creación automática de textos. GPT-2 generó controversia por su capacidad de producir desinformación convincente, llevando a OpenAI a implementar un lanzamiento gradual por consideraciones de seguridad.',url:'https://openai.com/index/better-language-models/'},
    {y:'2020',ico:'ti-sparkles',tag:'tech',t:'GPT-3 de OpenAI: abriendo el lenguaje natural',d:'La llegada de GPT-3 en mayo de 2020 representó una revolución en la generación de lenguaje natural al ofrecer capacidades de escritura y razonamiento hasta entonces inimaginables con 175 mil millones de parámetros. Su lanzamiento estableció un nuevo estándar en el desarrollo de inteligencia artificial, demostrando que el escalamiento de modelos podía producir capacidades emergentes como razonamiento matemático, traducción multilingüe y programación, sin entrenamiento específico para esas tareas.',url:'https://en.wikipedia.org/wiki/GPT-3'},
  ]},
  {era:'La era moderna de la IA',years:'2021–2024',eid:'moderna',items:[
    {y:'2021',ico:'ti-terminal',tag:'tech',t:'OpenAI Codex: programación en lenguaje natural',d:'OpenAI Codex transformó la programación al generar automáticamente código a partir de descripciones en lenguaje natural, convirtiéndose en una herramienta indispensable para desarrolladores y marcando un avance significativo en la interacción entre humanos y máquinas. Codex demostró que los modelos de lenguaje podían ser adaptados para dominios técnicos específicos manteniendo la interfaz de lenguaje natural.',url:'https://openai.com/blog/openai-codex'},
    {y:'2021',ico:'ti-git-branch',tag:'tech',t:'GitHub Copilot: un nuevo avance en programación asistida',d:'Basado en OpenAI Codex, en junio de 2021, GitHub lanzó Copilot, un asistente de programación que autocompleta código en tiempo real. Marcó el inicio de la adopción masiva de IA generativa en el desarrollo de software, transformando los flujos de trabajo de millones de programadores al convertirse en el primer "copiloto de IA" ampliamente adoptado en una herramienta de productividad profesional.',url:'https://github.blog/2021-06-29-introducing-github-copilot-ai-pair-programmer/'},
    {y:'2021',ico:'ti-photo',tag:'tech',t:'DALL-E: creación de imágenes desde texto',d:'OpenAI lanzó DALL-E en enero de 2021. Este es el primer modelo ampliamente difundido capaz de generar imágenes a partir de descripciones textuales. Aunque limitado en resolución y acceso, demostró el potencial de la generación multimodal y anticipó la explosión de herramientas de imagen por IA, abriendo el campo de la síntesis de imagen a partir de texto.',url:'https://openai.com/research/dall-e'},
    {y:'2022',ico:'ti-photo-ai',tag:'tech',t:'DALL-E 2: la imaginación visual automatizada',d:'El 6 de abril de 2022, OpenAI lanzó DALL-E 2, un sistema capaz de crear imágenes realistas y arte a partir de descripciones en lenguaje natural con resolución y calidad significativamente mejoradas (1024x1024 píxeles). El 28 de septiembre de 2022, el sistema eliminó su lista de espera permitiendo acceso a millones de usuarios, marcando el inicio de la popularización masiva de la IA generativa visual. DALL-E 2 demostró que las máquinas podían exhibir capacidades creativas complejas y producir imágenes prácticamente indistinguibles de creaciones humanas, introduciendo herramientas profesionales como inpainting (edición de partes de imagen) y outpainting (extensión de bordes), transformando flujos de trabajo de diseño gráfico.',url:'https://openai.com/dall-e-2'},
    {y:'2022',ico:'ti-brain',tag:'tech',t:'El "incidente LaMDA": el debate sobre la conciencia',d:'Un ingeniero de Google afirmó en junio de 2022, que el modelo de lenguaje LaMDA había desarrollado sintiencia (conciencia propia). Aunque la afirmación fue desestimada técnicamente por la comunidad científica, el evento encendió un debate filosófico global sobre la naturaleza de la inteligencia y cómo los seres humanos nos relacionamos emocionalmente con las máquinas, revelando la facilidad con que los modelos de lenguaje pueden generar la ilusión de conciencia.',url:'https://www.bbc.com/mundo/noticias-61803565'},
    {y:'2022',ico:'ti-palette',tag:'tech',t:'Midjourney: arte generativo accesible',d:'Midjourney se lanzó públicamente en julio de 2022 como servicio de generación de imágenes a través de Discord, democratizando el acceso a herramientas de creación visual con IA. Su estilo distintivo y facilidad de uso lo convirtieron en referencia para artistas y diseñadores, estableciendo un nuevo paradigma en el que la creación de imágenes complejas no requería habilidades tradicionales de ilustración o diseño gráfico.',url:'https://www.midjourney.com/'},
    {y:'2022',ico:'ti-lock-open',tag:'tech',t:'Stable Diffusion: la revolución del código abierto',d:'Stability AI liberó Stable Diffusion en agosto de 2022. Este es un modelo de generación de imágenes de código abierto que podía ejecutarse en computadoras personales convencionales. Esta característica rompió el monopolio de los laboratorios cerrados, acelerando la innovación comunitaria y el desarrollo de aplicaciones por terceros; y democratizando verdaderamente el acceso a herramientas de generación de imágenes de alta calidad.',url:'https://stability.ai/news/stable-diffusion-public-release'},
    {y:'2022',ico:'ti-microphone',tag:'tech',t:'Whisper: transcripción de audio robusta',d:'OpenAI lanzó Whisper en septiembre de 2022, un sistema de reconocimiento de voz de código abierto entrenado con 680.000 horas de audio multilingüe. Whisper se convirtió en estándar para transcripción automática en múltiples aplicaciones profesionales, demostrando capacidades robustas en diferentes acentos, ruido de fondo y múltiples idiomas, superando significativamente a sistemas comerciales anteriores.',url:'https://openai.com/research/whisper'},
    {y:'2022',ico:'ti-message-circle',tag:'tech',t:'ChatGPT: el momento "iPhone" de la IA',d:'El 30 de noviembre de 2022, el lanzamiento de ChatGPT por OpenAI rompió récords históricos de adopción de usuarios, alcanzando 1 millón de usuarios en solo 5 días y 100 millones en 2 meses, convirtiéndose en la aplicación de consumo con el crecimiento más rápido de la historia. Su interfaz de chat accesible transformó la IA de una curiosidad de laboratorio a una herramienta de utilidad diaria para el público general, obligando a las grandes tecnológicas a reorientar sus estrategias. ChatGPT demostró que una interfaz conversacional simple podía hacer que modelos complejos fueran utilizables por cientos de millones de personas sin formación técnica.',url:'https://openai.com/blog/chatgpt'},
    {y:'2023',ico:'ti-eye',tag:'tech',t:'GPT-4: el salto a la multimodalidad',d:'OpenAI lanzó GPT-4 el 14 de marzo de 2023. Este es un modelo capaz de procesar no solo texto sino también imágenes, y con una capacidad de razonamiento muy superior a sus predecesores. El modelo demostró habilidades de nivel humano en diversos exámenes profesionales y académicos, estableciendo un nuevo estándar de rendimiento en la industria y demostrando que la arquitectura transformer podía escalar a capacidades cada vez más sofisticadas.',url:'https://openai.com/research/gpt-4'},
    {y:'2023',ico:'ti-alert-triangle',tag:'tech',t:'La carta de la pausa y la advertencia existencial: debate público sobre riesgos de IA',d:'En marzo de 2023, más de 1000 referentes en tecnología firmaron una carta pidiendo una pausa de al menos seis meses en el entrenamiento de modelos gigantes, mientras que figuras clave como Geoffrey Hinton ("el padrino de la IA") abandonaron sus puestos corporativos para advertir libremente sobre los riesgos de seguridad y control de una superinteligencia futura. Este evento elevó el debate sobre riesgos existenciales de la IA a la agenda pública y política global.',url:'https://futureoflife.org/open-letter/pause-giant-ai-experiments/'},
    {y:'2023',ico:'ti-brand-google',tag:'tech',t:'Google Bard: la respuesta de Google a ChatGPT',d:'En marzo de 2023, Google lanzó Bard, su chatbot conversacional basado inicialmente en LaMDA y posteriormente, en PaLM 2. Aunque su lanzamiento inicial fue precipitado y con errores públicos que causaron una caída del 7% en el valor de las acciones de Alphabet, marcó la entrada formal de Google en la competencia de IA conversacional, demostrando la presión competitiva que ChatGPT ejerció sobre la industria tecnológica.',url:'https://blog.google/technology/ai/bard-google-ai-search-updates/'},
    {y:'2023',ico:'ti-search',tag:'tech',t:'Microsoft integra GPT-4 en Bing: búsqueda conversacional',d:'Microsoft anunció en febrero de 2023, la integración de GPT-4 en su buscador Bing y navegador Edge, desafiando el dominio de Google en búsqueda web. Esta integración combinó búsqueda tradicional con capacidades conversacionales y generativas, marcando el primer intento serio de redefinir la búsqueda en internet mediante IA conversacional y demostrando la apuesta estratégica de Microsoft en su asociación con OpenAI.',url:'https://blogs.microsoft.com/blog/2023/02/07/reinventing-search-with-a-new-ai-powered-microsoft-bing-and-edge-your-copilot-for-the-web/'},
    {y:'2023',ico:'ti-shield-check',tag:'tech',t:'Claude de Anthropic: énfasis en seguridad',d:'Anthropic, fundada por ex-miembros de OpenAI incluyendo Dario Amodei, lanzó, en marzo de 2023, Claude, un asistente de IA enfocado en seguridad, reducción de sesgos y respuestas más confiables mediante Constitutional AI. Claude se posicionó como alternativa "más segura" en el mercado corporativo, priorizando la alineación de valores y la reducción de contenido dañino como diferenciador competitivo.',url:'https://www.anthropic.com/index/introducing-claude'},
    {y:'2023',ico:'ti-share',tag:'tech',t:'Llama 2 de Meta: impulso al ecosistema abierto',d:'Meta lanzó la familia de modelos Llama 2 el 18 de julio de 2023, poniendo a disposición de investigadores y empresas una tecnología de lenguaje de gran potencia (LLM) de forma gratuita con licencia comercial permitida. Esto impulsó significativamente el desarrollo de IAs privadas y locales, compitiendo con los modelos cerrados y democratizando el acceso a modelos de lenguaje de frontera, estableciendo a Meta como líder en IA de código abierto.',url:'https://ai.meta.com/llama/'},
    {y:'2023',ico:'ti-scale',tag:'law',t:'AI Act de la UE: la primera regulación integral',d:'La Unión Europea alcanzó un acuerdo histórico en diciembre de 2023 sobre la Ley de Inteligencia Artificial (AI Act), convirtiéndose en la primera legislación completa del mundo en clasificar los sistemas de IA por niveles de riesgo, prohibiendo ciertos usos inaceptables (como el puntaje social chino) y exigiendo transparencia a los modelos generativos. La legislación entró en vigencia en 2024, estableciendo un precedente global para la regulación de IA.',url:'https://www.europarl.europa.eu/news/en/press-room/20231206IPR15699/artificial-intelligence-act-deal-on-comprehensive-rules-for-trustworthy-ai'},
    {y:'2023',ico:'ti-photo',tag:'tech',t:'Midjourney v5: fotorrealismo generativo',d:'Midjourney lanzó su versión 5 en marzo de 2023, logrando niveles de realismo en imágenes generadas que dificultaron la distinción entre fotografías reales y creaciones sintéticas. El avance intensificó preocupaciones sobre deepfakes y desinformación visual, demostrando que la tecnología de generación de imágenes había alcanzado un punto en el que la autenticidad visual ya no podía asumirse sin verificación técnica.',url:'https://docs.midjourney.com/'},
    {y:'2023',ico:'ti-file-description',tag:'tech',t:'Claude 2 de Anthropic: conversaciones largas y documentos extensos',d:'Anthropic presentó Claude 2 en julio de 2023, con capacidad de procesar hasta 100.000 tokens (aproximadamente 75.000 palabras), permitiendo analizar documentos completos, libros y conversaciones extensas. Marcó un avance en la capacidad contextual de los modelos de lenguaje, demostrando que era posible mantener coherencia y relevancia en interacciones que se extendían por decenas de miles de palabras.',url:'https://www.anthropic.com/index/claude-2'},
    {y:'2023',ico:'ti-robot',tag:'tech',t:'AutoGPT y el nacimiento de los agentes autónomos: automatización de tareas complejas',d:'La comunidad de código abierto desarrolló AutoGPT en marzo de 2023. Este sistema permite a GPT-4 ejecutar tareas complejas de manera autónoma, planificando pasos, ejecutando código y autocorrigiéndose. Marcó el inicio de la era de agentes de IA capaces de trabajar con mínima supervisión, aunque también reveló limitaciones significativas en la confiabilidad de agentes completamente autónomos.',url:'https://github.com/Significant-Gravitas/AutoGPT'},
    {y:'2023',ico:'ti-notebook',tag:'tech',t:'NotebookLM de Google: asistente de investigación personalizado',d:'En julio, Google lanzó NotebookLM, una herramienta de IA que permite crear bases de conocimiento personalizadas a partir de documentos propios, convirtiéndose en referencia para investigadores y profesionales que buscan analizar grandes volúmenes de información con contexto específico. NotebookLM se destacó por su capacidad de generar "podcasts" de audio a partir de documentos, creando conversaciones sintéticas sobre el contenido.',url:'https://notebooklm.google/'},
    {y:'2023',ico:'ti-brand-google',tag:'tech',t:'Google Gemini: integración nativa multimodal',d:'Google consolidó sus esfuerzos bajo la marca Gemini en diciembre de 2023, lanzando modelos multimodales nativos (diseñados desde cero para entender video, audio y texto simultáneamente) y comenzando la integración profunda de esta tecnología en todo su ecosistema de productos (Android, Workspace, Search). Gemini representó el intento más ambicioso de Google de competir directamente con GPT-4.',url:'https://blog.google/technology/ai/google-gemini-ai/'},
    {y:'2024',ico:'ti-video',tag:'tech',t:'Sora: simulación del mundo físico en video',d:'En febrero de 2024, OpenAI presentó Sora, un modelo capaz de generar videos de hasta 1 minuto con alta fidelidad visual y adherencia a las instrucciones. Más allá de la estética, el modelo demostró una comprensión emergente de la física y el movimiento en el mundo tridimensional, sugiriendo que los modelos generativos pueden desarrollar representaciones implícitas del mundo físico sin entrenamiento explícito en física.',url:'https://openai.com/sora'},
    {y:'2024',ico:'ti-trophy',tag:'tech',t:'Premio Nobel de Física y Química a la IA: reconocimiento científico a fundamentos de la IA',d:'La Real Academia de las Ciencias de Suecia otorgó en octubre de 2024, el Nobel de Física a John Hopfield y Geoffrey Hinton por las bases de las redes neuronales, y el de Química a Demis Hassabis y John Jumper (Google DeepMind) por resolver el plegamiento de proteínas con AlphaFold. Esto legitimó a la IA como una disciplina científica fundamental, reconociendo que técnicas de IA habían contribuido significativamente al avance del conocimiento humano.',url:'https://www.nobelprize.org/prizes/'},
    {y:'2024',ico:'ti-stack',tag:'tech',t:'Claude 3: tres niveles de capacidad',d:'Anthropic lanzó la familia Claude 3 en marzo de 2024 (Haiku, Sonnet y Opus), ofreciendo modelos diferenciados por velocidad, costo y capacidad. Claude 3 Opus igualó o superó a GPT-4 en varios benchmarks, consolidando la competencia en el mercado de modelos de lenguaje avanzados y demostrando que OpenAI ya no era el único proveedor de modelos de frontera.',url:'https://www.anthropic.com/index/claude-3-family'},
    {y:'2024',ico:'ti-bolt',tag:'tech',t:'OpenAI GPT-4o: velocidad y accesibilidad mejoradas',d:'En mayo de 2024, OpenAI anunció GPT-4o (la "o" de "omni"), optimizado para velocidad y reducción de costos. El modelo procesa texto, audio e imagen de manera nativa, permitiendo interacciones en tiempo real con latencia tan baja como 232 milisegundos. OpenAI también democratizó el acceso ofreciendo gratuitamente GPT-4o a usuarios básicos, expandiendo masivamente el alcance de modelos avanzados.',url:'https://openai.com/index/hello-gpt-4o/'},
    {y:'2024',ico:'ti-award',tag:'tech',t:'Claude 3.5 Sonnet: nuevo estándar de rendimiento',d:'El 20 de junio, Anthropic lanzó Claude 3.5 Sonnet, un modelo de rango medio que superó al anterior Claude 3 Opus en múltiples benchmarks, estableciendo un nuevo récord en codificación con 64% en SWE-bench. El lanzamiento marcó un patrón en el que modelos más eficientes superan a modelos más grandes de la generación anterior, cuestionando la estrategia de simplemente escalar tamaño.',url:'https://www.anthropic.com/news/claude-3-5-sonnet'},
    {y:'2024',ico:'ti-search',tag:'tech',t:'Google AI Overviews y Project Astra: búsqueda con resúmenes generados por IA',d:'Google lanzó AI Overviews en mayo de 2024. Esta función apunta a mejorar la búsqueda en internet proporcionando resúmenes automatizados de información compleja. En el marco de Project Astra, Google también avanzó en la interpretación de contenido multimedia, permitiendo consultas sobre contenido específico dentro de videos y demostrando asistentes visuales en tiempo real con capacidad de razonamiento sobre el entorno.',url:'https://blog.google/products/search/generative-ai-google-search-may-2024/'},
    {y:'2024',ico:'ti-share',tag:'tech',t:'Meta Llama 3: código abierto competitivo',d:'Meta liberó Llama 3 en abril de 2024, con versiones de 8B y 70B parámetros; y posteriormente, Llama 3.1 en julio, con 405B parámetros, compitiendo directamente con GPT-4 en varios benchmarks. El modelo se distribuyó bajo licencia permisiva para uso comercial, fortaleciendo el ecosistema abierto y demostrando que modelos de código abierto podían alcanzar el rendimiento de los mejores modelos propietarios.',url:'https://ai.meta.com/blog/meta-llama-3/'},
    {y:'2024',ico:'ti-flag',tag:'tech',t:'Mistral Large 2: Europa en la competencia',d:'Mistral AI, startup francesa, lanzó Mistral Large 2 el 24 de julio de 2024, compitiendo con modelos estadounidenses y chinos. El modelo destacó por eficiencia, menor costo y cumplimiento con regulaciones europeas de IA, atrayendo clientes corporativos y gubernamentales en la UE y posicionando a Europa como competidor legítimo en el desarrollo de modelos de lenguaje de frontera.',url:'https://mistral.ai/news/mistral-large-2407/'},
    {y:'2024',ico:'ti-search',tag:'tech',t:'Perplexity AI: búsqueda conversacional con citas',d:'Durante este año, Perplexity consolidó su propuesta de motor de búsqueda conversacional que cita fuentes directamente, ofreciendo una alternativa al modelo tradicional de Google. Su adopción creció entre usuarios que buscan respuestas con referencias verificables, aunque enfrentó críticas y demandas por potencial violación de copyright al resumir contenido de medios sin compensación.',url:'https://www.perplexity.ai/'},
    {y:'2024',ico:'ti-video',tag:'tech',t:'Runway Gen-3: video generativo profesional',d:'En junio, Runway lanzó Gen-3, su modelo de generación de video más avanzado, usado en producciones cinematográficas y publicitarias. Demostró que la IA generativa comenzaba a competir con herramientas profesionales de postproducción, aunque las limitaciones en consistencia temporal y control preciso aún impedían su uso como reemplazo completo de técnicas tradicionales.',url:'https://runwayml.com/'},
    {y:'2024',ico:'ti-microphone',tag:'tech',t:'ElevenLabs: clonación de voz multilingüe',d:'ElevenLabs perfeccionó durante 2024 su tecnología de clonación y síntesis de voz, permitiendo generar audio realista en múltiples idiomas a partir de pocos segundos de muestra. La tecnología fue adoptada ampliamente para localizaciones y accesibilidad, aunque generó preocupaciones sobre deepfakes de audio y fue utilizada en múltiples casos de fraude y suplantación de identidad.',url:'https://elevenlabs.io/'},
    {y:'2024',ico:'ti-users',tag:'tech',t:'ChatGPT alcanza 200 millones de usuarios semanales: consolidación de adopción masiva',d:'OpenAI anunció en agosto de 2024 que ChatGPT superó los 200 millones de usuarios activos semanales, consolidándose como la aplicación de IA más utilizada globalmente y marcando la adopción masiva de herramientas generativas. Este hito demostró que la IA conversacional había pasado de experimento tecnológico a infraestructura cotidiana para cientos de millones de personas.',url:'https://www.reuters.com/technology/artificial-intelligence/openai-says-chatgpts-weekly-users-have-grown-200-million-2024-08-29/'},
    {y:'2024',ico:'ti-brain',tag:'tech',t:'OpenAI o1: el auge del razonamiento',d:'El 12 de septiembre de 2024, OpenAI lanzó o1-preview, marcando un viraje de la industria desde la velocidad hacia el razonamiento profundo. El modelo introdujo la capacidad de "pensar antes de responder" (Cadena de Pensamiento), mejorando drásticamente el rendimiento en matemáticas (83% en AIME vs 13% de GPT-4o), programación competitiva (percentil 89 en Codeforces) y ciencias complejas, reduciendo los errores lógicos a cambio de mayor tiempo de respuesta.',url:'https://openai.com/index/introducing-openai-o1-preview/'},
    {y:'2024',ico:'ti-device-desktop',tag:'tech',t:'Anthropic Computer Use: IA que controla interfaces',d:'El 22 de octubre de 2024, Anthropic presentó Computer Use junto con Claude 3.5 Sonnet actualizado, una capacidad experimental que permite a Claude controlar computadoras directamente (mover mouse, escribir, navegar), habilitando automatización de tareas complejas que requieren interacción con múltiples aplicaciones. Aunque experimental y con errores frecuentes, demostró el potencial de agentes verdaderamente autónomos capaces de operar software existente sin modificaciones.',url:'https://www.anthropic.com/news/3-5-models-and-computer-use'},
    {y:'2024',ico:'ti-flag',tag:'tech',t:'DeepSeek-V3: China alcanza paridad técnica',d:'DeepSeek, empresa china, lanzó DeepSeek-V3 el 25 de diciembre de 2024. El modelo de 671B parámetros (37B activos) igualó GPT-4o en benchmarks principales mientras costaba una fracción en entrenamiento (aproximadamente $5.6 millones) e inferencia. El lanzamiento consolidó a China como competidor técnico de primer nivel en IA generativa, demostrando que la optimización algorítmica podía desafiar la premisa de que solo era posible avanzar con inversiones masivas en hardware de última generación.',url:'https://www.deepseek.com/'},
    {y:'2024',ico:'ti-brand-google',tag:'tech',t:'Gemini 2.0 Flash: siguiente generación de Google',d:'El 11 de diciembre de 2024, Google lanzó Gemini 2.0 Flash experimental, con capacidades multimodales nativas mejoradas, procesando simultáneamente texto, imagen, audio y video con coherencia superior. Introdujo "Deep Research", modo que permite investigación autónoma en múltiples fuentes con síntesis de hallazgos, y anunció prototipos agénticos como Project Mariner (navegación web) y Jules (codificación en GitHub).',url:'https://blog.google/technology/google-deepmind/google-gemini-ai-update-december-2024/'},
  ]},
  {era:'Madurez y consolidación',years:'2025–2026',eid:'madurez',items:[
    {y:'2025',ico:'ti-rocket',tag:'tech',t:'DeepSeek R1 y la eficiencia algorítmica: razonamiento competitivo a bajo costo',d:'El 20 de enero de 2025, DeepSeek lanzó R1, un modelo de razonamiento basado en V3 que iguala el rendimiento de OpenAI o1 en múltiples benchmarks (79.8% en AIME, 97.3% en MATH-500, rating Elo 2029 en Codeforces), a una fracción del costo operativo. R1 demostró que técnicas de reinforcement learning aplicadas a modelos eficientes pueden producir capacidades de razonamiento comparables a las de modelos entrenados con recursos mucho mayores, desafiando la narrativa de que solo laboratorios con recursos masivos podían liderar en IA.',url:'https://www.bbc.com/mundo/articles/cqx93d7e1weo'},
    {y:'2025',ico:'ti-sparkles',tag:'tech',t:'Claude Sonnet 4: nuevo estándar de calidad',d:'Anthropic lanzó Claude Sonnet 4 el 29 de septiembre de 2024 (la numeración "4" se adelantó a la fecha), destacándose por capacidades mejoradas de razonamiento, procesamiento de contexto extendido a 200.000 tokens y reducción significativa de alucinaciones. El modelo se posicionó como referencia para tareas complejas de análisis y redacción en entornos profesionales, especialmente en generación de código y análisis de documentos legales y técnicos extensos.',url:'https://www.anthropic.com/'},
    {y:'2025',ico:'ti-brand-google',tag:'tech',t:'Gemini 2.0: disponibilidad general',d:'Google lanzó Gemini 2.0 en disponibilidad general el 5 de febrero de 2025, consolidando capacidades multimodales nativas con procesamiento simultáneo de texto, imagen, audio y video. El modelo introdujo mejoras significativas en "Deep Research", razonamiento con Gemini 2.0 Flash Thinking, y comenzó integración profunda en productos de Google (Search, Workspace, Android), demostrando el intento de Google de hacer de la IA una capa fundamental en su ecosistema.',url:'https://blog.google/innovation-and-ai/models-and-research/google-deepmind/gemini-model-updates-february-2025/'},
    {y:'2025',ico:'ti-share',tag:'tech',t:'Llama 4 de Meta: código abierto multimodal nativo',d:'El 5 de abril de 2025, Meta AI lanzó la serie Llama 4, presentando inicialmente los modelos Maverick (400B parámetros totales) y Scout (109B parámetros), ambos con arquitectura nativa multimodal. Llama 4 Maverick redefinió las expectativas del código abierto al utilizar una arquitectura de Mezcla de Expertos (MoE) con 128 expertos, activando solo una fracción por token para mantener eficiencia. Con ventana de contexto de hasta 1 millón de tokens, se convirtió en herramienta fundamental para análisis de big data y creación de agentes autónomos.',url:'https://ai.meta.com/blog/llama-4-multimodal-intelligence/'},
    {y:'2025',ico:'ti-robot',tag:'tech',t:'GPT-5.2: agentes de largo horizonte',d:'El 11 de diciembre de 2025, OpenAI presentó GPT-5.2, culminación de la serie GPT-5 con mejoras sustanciales en razonamiento de largo horizonte y consistencia en tareas que duran horas o días. El modelo fue optimizado para interactuar con "Connectors" que permitían leer y escribir directamente en servicios de terceros como Salesforce, Slack y GitHub. La actualización incluyó un sistema de personalidad más cálido y conversacional, reducción drástica de alucinaciones en temas técnicos y médicos, y marcó el retiro oficial de los modelos GPT-4 del chat activo.',url:'https://openai.com/research/'},
    {y:'2025',ico:'ti-world',tag:'tech',t:'OpenAI Operator: navegación web autónoma',d:'OpenAI lanzó Operator en enero de 2025, un agente capaz de navegar la web de manera autónoma, completar formularios, realizar compras y gestionar tareas complejas en múltiples sitios web. Operator representó la primera implementación comercial de un agente web verdaderamente autónomo, compitiendo directamente con Project Mariner de Google. El sistema utilizó Computer Use Vision, permitiendo al modelo "ver" páginas web y razonar sobre elementos visuales antes de interactuar.',url:'https://openai.com/es-419/index/introducing-operator/'},
    {y:'2025',ico:'ti-robot',tag:'tech',t:'Agentes autónomos: de asistentes a ejecutores',d:'Durante 2025, se consolidó la transición de chatbots pasivos a "agentes de IA" capaces de ejecutar tareas complejas con mínima supervisión. Sistemas como Claude Computer Use, DeepMind Project Mariner, y OpenAI Operator ganaron capacidad de usar computadoras como lo haría un humano: navegando por interfaces, utilizando software, escribiendo código y completando flujos de trabajo de múltiples pasos sin supervisión constante. Aunque con limitaciones significativas de confiabilidad, estos sistemas demostraron un cambio fundamental en las capacidades de IA.',url:'https://claude.com/solutions/agents'},
    {y:'2025',ico:'ti-shield',tag:'law',t:'Coalition for Content Provenance and Authenticity (C2PA) se expande: metadatos de autenticidad',d:'El estándar C2PA para autenticación de contenido digital, desarrollado por Adobe, Microsoft, BBC y otros, alcanzó adopción crítica durante 2025. Principales cámaras fotográficas, software de edición profesional y plataformas sociales comenzaron a implementar metadatos de procedencia para combatir deepfakes, creando una infraestructura de verificación de autenticidad para medios digitales en un mundo en el que el contenido sintético es indistinguible del capturado.',url:'https://c2pa.org/'},
    {y:'2026',ico:'ti-building',tag:'tech',t:'IA como infraestructura cotidiana: integración masiva consolidada',d:'Para febrero de 2026, la IA generativa se consolidó como componente estructural en múltiples industrias. Las aplicaciones con IA integrada superaron el umbral de adopción masiva, con más de mil millones de usuarios activos globalmente interactuando regularmente con sistemas de IA generativa en asistentes digitales, herramientas de productividad, servicios de atención al cliente, creación de contenido y análisis de datos. La IA dejó de ser una característica diferenciadora para convertirse en expectativa básica de software moderno.',url:'#'},
    {y:'2026',ico:'ti-world',tag:'law',t:'Diálogo Global sobre Gobernanza de IA — ONU: coordinación multilateral',d:'Naciones Unidas estableció formalmente el Diálogo Global sobre la Gobernanza de la IA mediante la Resolución A/RES/79/325, representando el primer esfuerzo coordinado mundial para establecer estándares de seguridad y ética bajo auspicio de la Asamblea General. El diálogo se estructuró en tres pilares: gestión de riesgos de modelos de frontera, distribución equitativa de beneficios de IA, y alineación de normas para reducir fragmentación regulatoria global.',url:'https://www.un.org/global-dialogue-ai-governance/en'},
    {y:'2026',ico:'ti-building-factory',tag:'law',t:'Centros de Datos Soberanos de Canadá: IA como infraestructura crítica nacional',d:'El gobierno de Canadá lanzó una iniciativa para financiar y construir centros de datos de IA soberanos a gran escala como parte del presupuesto 2025. El gobierno abrió un período de propuestas (15 enero–15 febrero 2026) para proyectos de centros de datos de más de 100 megavatios que prioricen la participación de socios canadienses y comunidades indígenas. La "IA Soberana" se convirtió en pilar de la política económica canadiense, reconociendo que el cómputo es el nuevo recurso estratégico equivalente a energía o agua.',url:'https://ised-isde.canada.ca/site/ised/en/enabling-large-scale-sovereign-ai-data-centres'},
    {y:'2026',ico:'ti-users',tag:'tech',t:'Claude Opus 4.6: agentes de equipo y autonomía organizacional — AI Teammates en producción',d:'El 5 de febrero de 2026, Anthropic lanzó Claude Opus 4.6, modelo optimizado para gestión autónoma de organizaciones y tareas de largo horizonte. El lanzamiento marcó el inicio de AI Teammates (compañeros de equipo de IA), introduciendo la función de Agent Teams en vista previa, que permite asignar una tarea general y desplegar múltiples sub-agentes trabajando en paralelo en diferentes partes del proyecto. Opus 4.6 demostró capacidad de gestionar repositorios de software de equipos de 50 personas, cerrando issues y asignando tareas de forma autónoma.',url:'https://www.anthropic.com/news/claude-opus-4-6'},

const tagL={tech:'Tecnología',film:'Cultura',law:'Regulación'};
const tagC={tech:'tag-tech',film:'tag-film',law:'tag-law'};
const FILTERS=[
  {id:'all',label:'Todas las eras'},
  {id:'inicio',label:'El inicio'},
  {id:'invierno',label:'El invierno'},
  {id:'avances',label:'Avances'},
  {id:'moderna',label:'Era moderna'},
  {id:'madurez',label:'Madurez 2025–26'},
];

let active='all';

function matchesFilter(era,item){
  if(active==='all') return true;
  if(active.startsWith('_')) return item.tag===active.slice(1);
  return era.eid===active;
}

function buildFilters(){
  const f=document.getElementById('filters');
  f.innerHTML=FILTERS.map(fi=>`<button class="fpill${fi.id===active?' on':''}" data-f="${fi.id}">${fi.label}</button>`).join('');
  f.querySelectorAll('.fpill').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.f;render()}));
}

function render(){
  buildFilters();
  const main=document.getElementById('main');
  main.innerHTML='';
  DATA.forEach(era=>{
    const vis=era.items.filter(i=>matchesFilter(era,i));
    if(!vis.length) return;
    const sec=document.createElement('div');sec.className='era';
    sec.innerHTML=`<div class="era-hdr"><span class="era-tag">${era.era}</span><span class="era-years">${era.years}</span><span class="era-line"></span></div>`;
    const track=document.createElement('div');track.className='track';
    vis.forEach(item=>{
      const div=document.createElement('div');div.className='item';
      const dot=document.createElement('div');dot.className='item-dot';
      div.appendChild(dot);
      const card=document.createElement('div');card.className='card';
      card.innerHTML=`
        <div class="card-head">
          <span class="cy">${item.y}</span>
          <i class="ti ${item.ico} cico" aria-hidden="true"></i>
          <span class="ctitle">${item.t}</span>
          <span class="ctag ${tagC[item.tag]}">${tagL[item.tag]}</span>
          <i class="ti ti-chevron-down cchev" aria-hidden="true"></i>
        </div>
        <div class="card-body" style="max-height:600px">
          <div class="card-inner">
            <p class="cdesc">${item.d}</p>
            ${item.url&&item.url!='#'?`<a class="clink" href="${item.url}" target="_blank"><i class="ti ti-external-link" style="font-size:12px" aria-hidden="true"></i> Ver fuente</a>`:''}
          </div>
        </div>`;
      card.querySelector('.card-head').addEventListener('click',()=>{
        div.classList.toggle('closed');
      });
      div.appendChild(card);
      track.appendChild(div);
    });
    sec.appendChild(track);
    main.appendChild(sec);
  });
}

render();
</script>

</html>
